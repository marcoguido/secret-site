name: Build & Deploy (StatiCrypt + GitHub Pages)

on:
  release:
    types: [published]
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & encrypt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build site (vue-tsc + vite)
        env:
          VITE_TRAVEL_IBAN: ${{ secrets.VITE_TRAVEL_IBAN }}
          VITE_TRAVEL_IBAN_HOLDER: ${{ secrets.VITE_TRAVEL_IBAN_HOLDER }}
          VITE_TRAVEL_IBAN_BANK: ${{ secrets.VITE_TRAVEL_IBAN_BANK }}
          VITE_GIFT_IBAN: ${{ secrets.VITE_GIFT_IBAN }}
          VITE_GIFT_IBAN_HOLDER: ${{ secrets.VITE_GIFT_IBAN_HOLDER }}
          VITE_GIFT_IBAN_BANK: ${{ secrets.VITE_GIFT_IBAN_BANK }}
        run: npm run build

      - name: Encrypt with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
          STATICRYPT_SALT: ${{ vars.STATICRYPT_SALT }}
        run: |
          if [ -z "${STATICRYPT_PASSWORD}" ]; then
            echo "::error::secrets.STATICRYPT_PASSWORD is not set"; exit 1
          fi
          if [ -z "${STATICRYPT_SALT}" ]; then
            echo "::error::vars.STATICRYPT_SALT is not set"; exit 1
          fi
          rm -rf docs
          npx staticrypt dist/* -r \
            -d docs \
            -p "${STATICRYPT_PASSWORD}" \
            -s "${STATICRYPT_SALT}" \
            -c false \
            --template-button Accedi \
            --template-color-primary \#d99b16 \
            --template-color-secondary \#81c5e4 \
            --template-error 'Oh oh oh, non hai detto la parola magica' \
            --template-remember 'Mantienimi loggato' \
            --template-title 'Sbircia qualche informazione in più sulle nostre nozze!'\
            --template-toggle-hide 'Nascondi la password' \
            --template-toggle-show 'Mostra la password'

      - name: Verify CNAME copied into output
        run: test -f docs/CNAME && grep -q '^carlyeguido\.love$' docs/CNAME

      - name: Upload Pages artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
